# Segunda semilla del experimento v6 y pruebas extremas, en GitHub Actions (no depende del Mac).
# Ver docs/experimentos/v6-pistas.md.
#
#   entrenar     v6 (Mónaco, Bosque y Puerto) y control (Mónaco) con la semilla 1, en paralelo
#   fase-a       las dos semillas 1 en Mónaco, Bosque, Puerto y Puerto r9.5 (nunca en la Sierra)
#   extremos     las 21 pruebas de generalización de params.yaml con la v6 y el control, semillas 0 y 1
#   guardar      sube las métricas a esta rama con un commit
#
# Ya corrió una vez (run 42948616971, 11 de noviembre de 2026) y sus resultados están en metrics/. Ahora solo
# se lanza a mano (Actions → Semillas v6 → Run workflow), para que un push no vuelva a entrenar y sobrescriba
# las métricas publicadas.
name: Semillas v6

on:
  workflow_dispatch:

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: v6-s1
            pistas: monaco,bosque,puerto
          - nombre: control-s1
            pistas: monaco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno del entrenamiento
        run: pip install -r requirements.txt && pip install -e .
      - name: Demostraciones (etapa datos, determinista)
        run: rally pipeline datos
      - name: Entrenar ${{ matrix.nombre }} (semilla 1)
        run: python scripts/analisis/entrenar_semilla.py --pistas ${{ matrix.pistas }} --semilla 1
      - name: Exportar a numpy (comparado con PyTorch)
        run: |
          python - <<'EOF'
          import json
          from rally.agentes.red_numpy import exportar
          d = "models/semillas-v6/${{ matrix.nombre }}"
          r = exportar(f"{d}/modelo.zip", f"{d}/modelo.npz")
          json.dump(r, open(f"{d}/exportacion.json", "w"), indent=2)
          print(r)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: |
            models/semillas-v6/${{ matrix.nombre }}
            mlflow.db
            mlruns
          retention-days: 90

  fase-a:
    needs: entrenar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno
        run: pip install -r requirements.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Fase A con la semilla 1 (sin la Sierra)
        run: |
          python scripts/analisis/sobreajuste_pistas.py \
            --modelo v6-pistas-s1=artefactos/v6-s1/models/semillas-v6/v6-s1/modelo.npz:monaco,bosque,puerto \
            --modelo control-monaco-s1=artefactos/control-s1/models/semillas-v6/control-s1/modelo.npz:monaco \
            --episodios 100 --salida metrics/semillas-v6.json
      - uses: actions/upload-artifact@v4
        with:
          name: metricas-fase-a
          path: metrics/semillas-v6.json

  extremos:
    needs: entrenar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno
        run: pip install -r requirements.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: 21 pruebas de generalización (las de rally seleccionar)
        run: |
          python scripts/analisis/generalizacion_modelos.py \
            --modelo v6-s0=web/api/_paquete/pesos/528ea053635d903d2a7319ae64ff263044dc7de61eccd2b20e89a6b703b69e8d.npz \
            --modelo control-s0=docs/experimentos/pesos/control-ppo-monaco-s0.npz \
            --modelo v6-s1=artefactos/v6-s1/models/semillas-v6/v6-s1/modelo.npz \
            --modelo control-s1=artefactos/control-s1/models/semillas-v6/control-s1/modelo.npz \
            --salida metrics/generalizacion-v6-control.json
      - uses: actions/upload-artifact@v4
        with:
          name: metricas-extremos
          path: metrics/generalizacion-v6-control.json

  guardar:
    needs: [entrenar, fase-a, extremos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Subir métricas a la rama
        run: |
          mkdir -p metrics docs/experimentos/semillas-v6
          cp artefactos/metricas-fase-a/semillas-v6.json metrics/ 2>/dev/null || true
          cp artefactos/metricas-extremos/generalizacion-v6-control.json metrics/ 2>/dev/null || true
          for m in v6-s1 control-s1; do
            cp artefactos/$m/models/semillas-v6/$m/info.json docs/experimentos/semillas-v6/$m-info.json 2>/dev/null || true
            cp artefactos/$m/models/semillas-v6/$m/exportacion.json docs/experimentos/semillas-v6/$m-exportacion.json 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics docs/experimentos/semillas-v6
          git diff --cached --quiet && { echo "Sin resultados nuevos"; exit 0; }
          git commit -m "Resultados de las semillas 1 y pruebas extremas (run ${{ github.run_id }})"
          git push
