# Integración continua: en cada push GitHub corre las pruebas, compila la web, revisa que el paquete
# de la API publicada esté al día y construye el contenedor de la API para probarlo de verdad.
name: Verificar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno del entrenamiento
        run: pip install -r requirements.txt && pip install -e .
      - name: Pruebas (ambiente, agentes, API, selección y red numpy)
        run: pytest -q
      - name: Paquete de Vercel al día con src/ y manifests/
        if: hashFiles('web/api/_paquete/paquete.json') != ''
        run: python deploy/api/empaquetar.py web/api/_paquete --verificar

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  contenedor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Armar el paquete de la API sin pesos (los modelos viven en DVC)
        run: |
          pip install gymnasium numpy scipy rich pyyaml
          pip install --no-deps -e .
          python deploy/api/empaquetar.py "$RUNNER_TEMP/rally-api" --sin-pesos
      - name: Construir la imagen
        run: docker build -t rally-api "$RUNNER_TEMP/rally-api"
      - name: Probar la imagen
        run: |
          docker run -d --name api -p 7860:7860 rally-api
          for i in $(seq 1 30); do curl -fsS localhost:7860/api/salud && break; sleep 2; done
          echo
          curl -fsS "localhost:7860/api/episodio?piloto=maestro&mu=0.5" \
            | python -c "import sys, json; d = json.load(sys.stdin); assert d['resultado'] == 'exito', d['resultado']; assert d['commit_servido'] == '${{ github.sha }}', d['commit_servido']; print('maestro con lluvia:', d['tiempo'], 's')"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:7860/api/episodio?piloto=ppo-modelo-v5-s1')" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:7860/api/episodio?piloto=no-existe')" = 404
          docker image ls rally-api
      - name: Registro del contenedor
        if: always()
        run: docker logs api || true
