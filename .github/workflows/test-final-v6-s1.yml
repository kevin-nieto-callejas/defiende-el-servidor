# Test reservado de la v6 semilla 1, una sola vez (mismo procedimiento que rally test-final).
# Las 100 semillas salen del secreto RALLY_SEMILLA_RESERVADA_V6S1, que ningún entrenamiento ni decisión vio;
# solo se publica su SHA-256. El resultado va a metrics/test-final-v6-s1.json, aparte del de la v5-s1, y el
# flujo se niega a correr si ese archivo ya existe.
name: Test final v6-s1

on:
  push:
    branches: [semillas-v6]
    paths: [.github/workflows/test-final-v6-s1.yml]

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  OMP_NUM_THREADS: "1"   # sin esto cada proceso abre varios hilos de PyTorch y todo va más lento

jobs:
  test-final:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar que se puede correr (secreto presente y test sin correr)
        env:
          SEMILLA: ${{ secrets.RALLY_SEMILLA_RESERVADA_V6S1 }}
        run: |
          test -n "$SEMILLA" || { echo "Falta el secreto RALLY_SEMILLA_RESERVADA_V6S1: no se corre nada"; exit 1; }
          test ! -e metrics/test-final-v6-s1.json || { echo "El test ya se corrió: no se repite"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar el entorno
        run: pip install -r requirements.txt && pip install -e .
      - name: Bajar la v6 semilla 1 (run 42948616971) y comprobar su SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42948616971 -n v6-s1 -D artefactos
          echo "1f68d191777373d5811c205ce23650558dd0cf2ac55d6fd50156be20c1c94edf  artefactos/models/semillas-v6/v6-s1/modelo.zip" | sha256sum -c
      - name: Test reservado (100 semillas secretas, seco, lluvia y 19 pruebas extremas)
        env:
          RALLY_SEMILLA_RESERVADA: ${{ secrets.RALLY_SEMILLA_RESERVADA_V6S1 }}
        run: |
          python - <<'EOF'
          from pathlib import Path
          import rally.testfinal as t
          t.SALIDA = Path("metrics/test-final-v6-s1.json")
          r = t.correr({"ppo-modelo-v6-pistas-s1": ("ppo", "artefactos/models/semillas-v6/v6-s1/modelo.zip")})
          res = r["resultados"]["ppo-modelo-v6-pistas-s1"]
          print("semillas sha256:", r["semillas_sha256"])
          print({k: v["vueltas_pct"] for k, v in res.items()})
          EOF
      - name: Subir el resultado a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/test-final-v6-s1.json
          git commit -m "Test reservado de la v6 semilla 1, una sola vez (run ${{ github.run_id }})"
          git pull --rebase origin semillas-v6
          git push origin HEAD:semillas-v6
